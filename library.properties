sentence=Easy analog joystick library (KY-023): auto center calibration, dead zone, -100..100 values, 8 directions, angle, button. No dependencies.
paragraph=Reads a two-axis analog joystick with a button: x() and y() from -100 to 100, direction(), angle(), magnitude(). Finds the real center at start, ignores jitter near the center with a dead zone, supports Arduino AVR and ESP32 ADC ranges, and explains wiring problems in Russian, Kazakh or English. Examples included, made for classes and kits by Alash Electronics.
